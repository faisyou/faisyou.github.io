<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Umer’s Science Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F8FB;--card:#FFFFFF;--ink:#37424D;--soft:#5F6C79;--line:#C9D7E3;
  --blue:#3F7BA6;--blueL:#E4EFF7;--green:#2E9E5B;--greenL:#E2F4E9;
  --gold:#E3A92B;--lav:#ECEAF8;--ring:#6C63C9;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible",Verdana,Tahoma,"Segoe UI",sans-serif;
  font-size:22px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:32px;line-height:1.2;margin:8px 0 6px;text-align:center}
.sub{font-size:22px;color:var(--soft);text-align:center;margin:0 0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:64px;padding:10px 22px;border-radius:20px;border:3px solid var(--blue);background:var(--blue);
  color:#fff;font:inherit;font-size:24px;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:var(--blue)}
.btn.soft{background:var(--lav);border-color:var(--lav);color:var(--ink)}
.btn.big{min-width:200px}
.btn:focus-visible,.card:focus-visible,.choice:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:16px;text-align:center;
  font:inherit;color:inherit;cursor:pointer;min-height:64px}
.card .pic{height:130px}
.card .label{font-size:26px;font-weight:700;margin-top:8px}
.card .line{font-size:22px;margin-top:6px}
.card.still{cursor:default}
.pic svg{width:100%;height:100%;display:block}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
/* quiz */
.progress{text-align:center}
.stars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stars svg{width:30px;height:30px}
.count{font-size:20px;color:var(--soft);margin-top:4px}
.q{font-size:28px;font-weight:700;text-align:center;min-height:2.9em;display:flex;align-items:center;justify-content:center;margin:10px 0 6px}
.stage{height:210px;background:#fff;border:3px solid var(--line);border-radius:24px;padding:10px;margin:6px 0 14px}
.stage svg{width:100%;height:100%}
.choices{display:grid;gap:12px}
.choice{min-height:72px;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;
  background:#fff;border:3px solid var(--line);border-radius:20px;font:inherit;font-size:24px;font-weight:700;
  color:var(--ink);cursor:pointer;text-align:center}
.choices.pics .choice{flex-direction:column;gap:4px;padding:8px}
.choice .cp{width:100%;height:96px}
.choice .cp svg{width:100%;height:100%}
.choice:disabled{cursor:default;color:var(--ink)}
.choice.faded{opacity:.4}
.choice.right{background:var(--greenL);border-color:var(--green)}
.choice.gold{border-color:var(--gold);border-width:6px}
.tick{width:34px;height:34px;flex:none}
.fb{min-height:116px;margin:14px 0 6px}
.fb p{margin:0 0 6px}
.fb.ok{display:flex;gap:12px;align-items:center;background:var(--greenL);border-radius:20px;padding:12px 16px;font-weight:700}
.hint{background:var(--blueL);border-radius:16px;padding:8px 14px}
.nextrow{min-height:72px;display:flex;justify-content:center}
.hidden{visibility:hidden}
details{margin-top:24px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px}
summary{font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
details li{margin:6px 0}
/* break */
.breakwrap{text-align:center;padding-top:30px}
.breath{width:200px;height:200px;border-radius:50%;background:var(--lav);margin:30px auto;
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.breath{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

const fh=(x,y,r)=>[0,72,144,216,288].map(a=>`<circle cx="${(x+r*.85*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(y+r*.85*Math.sin(a*Math.PI/180)).toFixed(1)}" r="${(r*.6).toFixed(1)}" fill="${C.petal}"/>`).join('')+`<circle cx="${x}" cy="${y}" r="${(r*.45).toFixed(1)}" fill="${C.sun}"/>`;
const leafP=(x,y,rot,l=14)=>`<ellipse cx="${x}" cy="${y}" rx="${l}" ry="7" transform="rotate(${rot} ${x} ${y})" fill="${C.leaf}"/>`;
const rays=(x,y,a,b,n,col,w)=>[...Array(n)].map((_,i)=>{const t=i*2*Math.PI/n;return `<path d="M${(x+a*Math.cos(t)).toFixed(1)} ${(y+a*Math.sin(t)).toFixed(1)}L${(x+b*Math.cos(t)).toFixed(1)} ${(y+b*Math.sin(t)).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`}).join('');
const soilBand=`<rect x="0" y="84" width="120" height="36" fill="${C.soil}"/>`;
const lampSmall=`<path d="M8 14H42L50 36H0Z" fill="${C.cream}" stroke="${C.ray}" stroke-width="3" stroke-linejoin="round"/><rect x="22" y="36" width="6" height="14" fill="${C.greyD}"/>`;

   flowerD:h=>svg(`<rect x="57" y="88" width="6" height="32" fill="${C.leafD}"/><ellipse cx="42" cy="92" rx="15" ry="6" transform="rotate(-20 42 92)" fill="${C.leaf}"/><ellipse cx="78" cy="92" rx="15" ry="6" transform="rotate(20 78 92)" fill="${C.leaf}"/><ellipse cx="26" cy="58" rx="14" ry="30" transform="rotate(-25 26 58)" fill="${C.petal}"/><ellipse cx="94" cy="58" rx="14" ry="30" transform="rotate(25 94 58)" fill="${C.petal}"/><path d="M60 90V42M60 90L40 48M60 90L80 48" stroke="${C.ink}" stroke-width="3" fill="none"/><ellipse cx="40" cy="45" rx="5" ry="8" fill="${C.ray}"/><ellipse cx="80" cy="45" rx="5" ry="8" fill="${C.ray}"/><circle cx="60" cy="38" r="8" fill="${C.leafD}"/>${hl(h,'petals',24,60,27)}${hl(h,'stamen',40,45,13)}${hl(h,'pistil',60,38,13)}${hl(h,'sepals',42,92,19)}`),
   bee:h=>svg(`<ellipse cx="46" cy="52" rx="17" ry="11" transform="rotate(-30 46 52)" fill="${C.blue}" opacity=".85"/><ellipse cx="70" cy="46" rx="17" ry="11" transform="rotate(-10 70 46)" fill="${C.blue}" opacity=".85"/><ellipse cx="62" cy="72" rx="30" ry="19" fill="${C.sun}"/><path d="M52 56V88M64 54V90M76 57V87" stroke="${C.ink}" stroke-width="6"/><circle cx="94" cy="72" r="11" fill="${C.ink}"/><circle cx="97" cy="69" r="3" fill="#fff"/>`),
   pollen:h=>svg([[45,50],[66,38],[82,58],[56,68],[74,82],[38,82],[92,84],[60,96],[28,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="8" fill="${C.ray}"/><circle cx="${p[0]-2}" cy="${p[1]-2}" r="3" fill="${C.sun}"/>`).join('')),
   pollination:h=>svg(`<rect x="25" y="96" width="6" height="24" fill="${C.leafD}"/><rect x="89" y="96" width="6" height="24" fill="${C.leafD}"/>${fh(28,80,17)}${fh(92,80,17)}<path d="M40 56Q60 28 82 56" stroke="${C.ink}" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M84 58L72 56L78 46Z" fill="${C.ink}"/><circle cx="44" cy="52" r="5" fill="${C.ray}"/><circle cx="60" cy="38" r="5" fill="${C.ray}"/><circle cx="76" cy="46" r="5" fill="${C.ray}"/>`),
   seed:h=>svg(`<ellipse cx="60" cy="62" rx="24" ry="34" transform="rotate(25 60 62)" fill="${C.seed}"/><path d="M50 40Q58 62 48 84" stroke="#8A6540" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>`),
   germ:h=>svg(`<rect x="0" y="62" width="120" height="58" fill="${C.soil}"/><ellipse cx="60" cy="84" rx="12" ry="8" fill="${C.seed}"/><path d="M58 90Q52 102 58 114" stroke="${C.root}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M60 78V46" stroke="${C.leafD}" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="42" rx="5" ry="8" fill="${C.leaf}"/>`),
   seedling:h=>svg(`${soilBand}<rect x="57" y="52" width="6" height="34" rx="3" fill="${C.leafD}"/>${leafP(46,52,-30,12)}${leafP(74,52,30,12)}`),
   young:h=>svg(`${soilBand}<rect x="56" y="28" width="8" height="58" rx="4" fill="${C.leafD}"/>${leafP(42,40,-30)}${leafP(78,36,30)}${leafP(44,64,-25)}${leafP(76,60,25)}`),
   mature:h=>svg(`${soilBand}<rect x="56" y="38" width="8" height="48" rx="4" fill="${C.leafD}"/>${leafP(42,62,-25)}${leafP(78,56,25)}${fh(60,24,13)}`),
   dispersal:h=>svg(`<rect x="0" y="100" width="120" height="20" fill="${C.soil}"/><rect x="23" y="46" width="6" height="56" fill="${C.leafD}"/>${leafP(14,80,-25,10)}${fh(26,38,11)}<path d="M38 36Q62 8 92 28" stroke="${C.ink}" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M94 30L82 30L88 20Z" fill="${C.ink}"/><circle cx="62" cy="34" r="5" fill="${C.seed}"/><circle cx="84" cy="52" r="5" fill="${C.seed}"/><circle cx="102" cy="40" r="5" fill="${C.seed}"/><circle cx="72" cy="78" r="5" fill="${C.seed}"/><circle cx="98" cy="86" r="5" fill="${C.seed}"/>`),
   sun:h=>svg(`<circle cx="60" cy="60" r="24" fill="${C.sun}"/>${rays(60,60,32,46,8,C.ray,5)}`),
   star:h=>svg(`<circle cx="60" cy="60" r="52" fill="#DCE5F4"/><polygon points="60,18 71,46 102,47 78,66 87,96 60,78 33,96 42,66 18,47 49,46" fill="${C.sun}" stroke="${C.ray}" stroke-width="3" stroke-linejoin="round"/>`),
   lamp:h=>svg(`<path d="M36 22H84L98 58H22Z" fill="${C.cream}" stroke="${C.ray}" stroke-width="4" stroke-linejoin="round"/><rect x="57" y="58" width="6" height="38" fill="${C.greyD}"/><ellipse cx="60" cy="100" rx="24" ry="7" fill="${C.greyD}"/><path d="M26 68L16 78M94 68L104 78" stroke="${C.ray}" stroke-width="4" stroke-linecap="round"/>${hl(h,'shade',60,40,40)}`),
   candle:h=>svg(`<rect x="44" y="56" width="32" height="52" rx="4" fill="${C.cream}" stroke="${C.grey}" stroke-width="3"/><rect x="59" y="46" width="3" height="12" fill="${C.ink}"/><path d="M60 14C72 28 74 40 60 48C46 40 48 28 60 14Z" fill="${C.orange}"/><path d="M60 28C65 34 66 40 60 44C54 40 55 34 60 28Z" fill="${C.sun}"/>`),
   firefly:h=>svg(`<circle cx="30" cy="66" r="18" fill="${C.ray}" opacity=".3"/><ellipse cx="46" cy="42" rx="20" ry="9" transform="rotate(-20 46 42)" fill="${C.blue}" opacity=".85"/><ellipse cx="56" cy="66" rx="26" ry="12" fill="${C.dark}"/><ellipse cx="32" cy="68" rx="12" ry="9" fill="${C.ray}"/><circle cx="86" cy="64" r="9" fill="${C.dark}"/><path d="M48 78L44 92M60 78V94M72 78L76 92" stroke="${C.dark}" stroke-width="3" stroke-linecap="round"/>`),
   tablet:h=>svg(`<rect x="12" y="28" width="96" height="66" rx="10" fill="${C.dark}"/><rect x="20" y="35" width="80" height="52" rx="4" fill="${C.blue}"/><circle cx="60" cy="61" r="10" fill="#fff" opacity=".7"/>`),
   glass:h=>svg(`<rect x="34" y="34" width="52" height="68" rx="12" fill="#DCEEFA" stroke="${C.blueD}" stroke-width="3"/><rect x="38" y="16" width="44" height="18" rx="4" fill="${C.grey}" stroke="${C.greyD}" stroke-width="2"/><path d="M44 50V86" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`),
   bag:h=>svg(`<rect x="20" y="26" width="80" height="74" rx="6" fill="#EAF5FC" stroke="${C.blueD}" stroke-width="3"/><path d="M20 40H100" stroke="${C.leafD}" stroke-width="5"/><path d="M32 56V86" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`),
   tincan:h=>svg(`<rect x="34" y="34" width="52" height="62" fill="${C.grey}"/><ellipse cx="60" cy="96" rx="26" ry="9" fill="${C.grey}"/><ellipse cx="60" cy="34" rx="26" ry="9" fill="${C.greyD}"/><path d="M34 52H86M34 76H86" stroke="${C.greyD}" stroke-width="3"/>`),
   tissue:h=>svg(`<path d="M22 32Q40 22 60 32T98 32V92Q80 102 60 92T22 92Z" fill="#F9D3DE" opacity=".85" stroke="#EDB1C3" stroke-width="3"/><path d="M40 40V86M60 42V88M80 40V86" stroke="#EDB1C3" stroke-width="2" opacity=".7"/>`),
   chair:h=>svg(`<rect x="34" y="22" width="52" height="38" rx="6" fill="${C.orange}"/><rect x="28" y="60" width="64" height="14" rx="5" fill="${C.orange}"/><rect x="34" y="74" width="7" height="36" fill="${C.greyD}"/><rect x="79" y="74" width="7" height="36" fill="${C.greyD}"/>`),
   hat:h=>svg(`<path d="M26 82Q26 36 60 36Q94 36 94 82Z" fill="#E58A8A"/><rect x="22" y="78" width="76" height="18" rx="7" fill="#D56F6F"/><circle cx="60" cy="30" r="10" fill="#F4C7C7"/><path d="M40 82V48M60 82V40M80 82V48" stroke="#D56F6F" stroke-width="3"/>`),
   spoon:h=>svg(`<ellipse cx="60" cy="34" rx="18" ry="25" fill="${C.grey}" stroke="${C.greyD}" stroke-width="3"/><rect x="55" y="56" width="10" height="56" rx="5" fill="${C.grey}" stroke="${C.greyD}" stroke-width="3"/>`),
   book:h=>svg(`<path d="M10 34Q34 26 58 38V98Q34 88 10 96Z" fill="#fff" stroke="${C.blueD}" stroke-width="3"/><path d="M110 34Q86 26 62 38V98Q86 88 110 96Z" fill="#fff" stroke="${C.blueD}" stroke-width="3"/><path d="M20 52Q34 48 48 54M20 66Q34 62 48 68M20 80Q34 76 48 82M72 54Q86 48 100 52M72 68Q86 62 100 66M72 82Q86 76 100 80" stroke="${C.grey}" stroke-width="3" fill="none" stroke-linecap="round"/>`),
   ball:h=>svg(`<circle cx="60" cy="60" r="38" fill="${C.ball}"/><path d="M28 48Q60 70 92 48" stroke="#fff" stroke-width="4" fill="none" opacity=".8"/><path d="M96 20L108 8M108 34L116 28M84 12L88 2" stroke="${C.ray}" stroke-width="4" stroke-linecap="round"/>`),
   seeing:h=>svg(`${lampSmall}<circle cx="60" cy="96" r="14" fill="${C.ball}"/><ellipse cx="100" cy="26" rx="16" ry="10" fill="#fff" stroke="${C.ink}" stroke-width="3"/><circle cx="100" cy="26" r="6" fill="${C.ink}"/><path d="M30 52L49 76" stroke="${C.ray}" stroke-width="4" stroke-linecap="round"/><polygon points="55,84 42.6,78.8 51.8,71" fill="${C.ray}"/><path d="M70 82L90 50" stroke="${C.ray}" stroke-width="4" stroke-linecap="round"/><polygon points="96,40 94.4,53.3 84.4,46.7" fill="${C.ray}"/>${hl(h,'lamp',25,28,30)}${hl(h,'ball',60,96,22)}${hl(h,'eye',100,26,22)}`),
   shadowScene:h=>svg(`<rect x="0" y="88" width="120" height="32" fill="#E4ECEF"/>${lampSmall}<path d="M30 40L46 62M32 40L100 92" stroke="${C.ray}" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/><circle cx="52" cy="70" r="14" fill="${C.ball}"/><ellipse cx="88" cy="100" rx="20" ry="6" fill="${C.dark}" opacity=".65"/>${hl(h,'shadow',88,100,20)}`)
  }
};

/* ---------- App (reads DATA only) ---------- */
const app=document.getElementById('app');
const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let st={v:'home'}, lastKey='';
const T=()=>DATA.subjects[st.si].topics[st.ti];
const pic=n=>{const [k,a]=(n||'ask').split(':');const f=DATA.pictures[k];return f?f(a):''};
const star=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 15,9 22,9.5 16.5,14 18.5,21.5 12,17.5 5.5,21.5 7.5,14 2,9.5 9,9" fill="${on?'#F2B705':'#fff'}" stroke="#E3A92B" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
const tick=`<svg class="tick" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#2E9E5B"/><path d="M9 16.5l5 5 9-10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const btn=(label,act,cls='')=>`<button class="btn ${cls}" onclick="${act}">${label}</button>`;
const listenBtn=act=>canSpeak?btn('Listen',act,'alt'):'';

function speak(t){if(!canSpeak)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}
function stopSpeak(){if(canSpeak)speechSynthesis.cancel()}
const listenQ=()=>speak(T().questions[st.qi].q);
const listenLook=()=>speak(T().look.map(c=>c.t).join(' '));

function openSubject(i){st={v:'topics',si:i};render()}
function openTopic(i){st={v:'look',si:st.si,ti:i};render()}
function goHome(){stopSpeak();st={v:'home'};render()}
function goTopics(){stopSpeak();st={v:'topics',si:st.si};render()}
function startQuiz(){stopSpeak();st={v:'quiz',si:st.si,ti:st.ti,qi:0,tries:0,wrong:[],pos:0,tot:0,done:false,log:T().questions.map(()=>0)};render()}
function viewQ(q){if(q.type!=='order')return q;return Object.assign({},q,{ch:q.show.map(k=>q.items[k]),a:q.show.indexOf(st.pos),_idx:q.show})}
function pick(i){const q=viewQ(T().questions[st.qi]);if(st.done||st.wrong.includes(i))return;
  if(i===q.a){if(q.type==='order'&&st.pos+1<q.items.length){st.pos++;st.tries=0;st.wrong=[]}else{if(q.type==='order')st.pos++;st.done=true;st.log[st.qi]=st.tot}}else{st.tries++;st.tot++;st.wrong.push(i)}render()}
function next(){stopSpeak();if(st.qi+1>=T().questions.length){st.v='finish'}else{st.qi++;st.tries=0;st.wrong=[];st.pos=0;st.tot=0;st.done=false}render()}
function takeBreak(){stopSpeak();st.v='break';render()}
function backToQuiz(){st.v='quiz';render()}

const views={
 home(){return `<div class="top"><div></div></div><h1>${DATA.title}</h1><p class="sub">${DATA.subtitle}</p>
  <div class="grid">${DATA.subjects.map((s,i)=>`<button class="card" onclick="openSubject(${i})"><div class="pic">${pic(s.pic)}</div><div class="label">${s.name}</div></button>`).join('')}</div>`},
 topics(){const s=DATA.subjects[st.si];
  return `<div class="top"><div>${btn('Back','goHome()','alt')}</div></div><h1>${s.name}</h1><p class="sub">Pick a topic.</p>
  <div class="grid">${s.topics.map((t,i)=>`<button class="card" onclick="openTopic(${i})"><div class="pic">${pic(t.pic)}</div><div class="label">${t.name}</div></button>`).join('')}</div>`},
 look(){const t=T();
  return `<div class="top"><div>${btn('Back','goTopics()','alt')}</div><div class="row">${listenBtn('listenLook()')}</div></div>
  <h1>${t.name}</h1><p class="sub">Look first.</p>
  <div class="grid">${t.look.map(c=>`<div class="card still"><div class="pic">${pic(c.p)}</div><div class="line">${c.t}</div></div>`).join('')}</div>
  <div class="actions">${btn('Start the quiz','startQuiz()','big')}</div>`},
 quiz(){const t=T(),q=viewQ(t.questions[st.qi]),n=t.questions.length;
  const filled=st.done?st.qi+1:st.qi;
  const picMode=q.ch.some(c=>c.p);
  const left=q.ch.length-st.wrong.length;
  const goldOn=!st.done&&(st.tries>=2||(st.tries>=1&&left===1));
  const choices=q.ch.map((c,i)=>{
    const faded=st.wrong.includes(i);
    const pl=q._idx&&q._idx[i]<st.pos;const cls=[faded?'faded':'',(st.done&&i===q.a)||pl?'right':'',goldOn&&i===q.a?'gold':''].join(' ');
    return `<button class="choice ${cls}" onclick="pick(${i})" ${faded||st.done||pl?'disabled':''}>${c.p?`<div class="cp">${pic(c.p)}</div>`:''}<span>${pl?(q._idx[i]+1)+'. ':''}${c.t}</span>${(st.done&&i===q.a)||pl?tick:''}</button>`}).join('');
  let fb=(q.type==='order'&&st.pos>0&&!st.done&&st.tries===0)?`<div class="fb ok">${tick}<span>Yes! Tap the next step.</span></div>`:'<div class="fb"></div>';
  if(st.done)fb=`<div class="fb ok">${tick}<span>${q.fact}</span></div>`;
  else if(st.tries>0)fb=`<div class="fb"><p><b>Not this one. Let us try again.</b></p><p class="hint">Hint: ${q.hint}</p></div>`;
  return `<div class="top"><div>${btn('Home','goHome()','alt')}</div><div class="row">${listenBtn('listenQ()')}${btn('Break','takeBreak()','soft')}</div></div>
  <div class="progress"><div class="stars" aria-hidden="true">${t.questions.map((_,i)=>star(i<filled)).join('')}</div><div class="count">Question ${st.qi+1} of ${n}</div></div>
  <div class="q">${q.q}</div>
  <div class="stage">${pic(q.pic)}</div>
  <div class="choices ${picMode?'pics':''}" style="${picMode?`grid-template-columns:repeat(${Math.min(q.ch.length,3)},1fr)`:''}">${choices}</div>
  <div aria-live="polite">${fb}</div>
  <div class="nextrow">${btn('Next','next()',st.done?'big':'big hidden').replace('<button','<button '+(st.done?'':'disabled tabindex="-1"'))}</div>`},
 finish(){const t=T(),n=t.questions.length;
  const helped=st.log.map((x,i)=>x>0?`<li>Question ${i+1}: ${t.questions[i].q} (${x} ${x===1?'try':'tries'} before the right answer${x>=2?', gold border shown':''})</li>`:'').join('');
  return `<div class="top"><div>${btn('Home','goHome()','alt')}</div></div>
  <div class="progress"><div class="stars" aria-hidden="true">${t.questions.map(()=>star(true)).join('')}</div></div>
  <h1>Well done, Umer!</h1><p class="sub">You finished ${t.name}. You worked hard.</p>
  <div class="stage">${pic(t.pic)}</div>
  <div class="actions">${btn('Play again','startQuiz()')}${btn('Back to subjects','goHome()','alt')}</div>
  <details><summary>For grown-ups</summary>${helped?`<p>Questions that needed a hint:</p><ul>${helped}</ul>`:'<p>No hints were needed.</p>'}</details>`},
 break(){return `<div class="top"><div></div></div><div class="breakwrap"><h1>Break time</h1><p class="sub">Take as long as you like.</p><div class="breath" aria-hidden="true"></div>${btn('Back to my question','backToQuiz()','big')}</div>`}
};

function render(){
  const key=st.v+'|'+st.si+'|'+st.ti+'|'+(st.qi||0);
  app.innerHTML=views[st.v]();
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key}
}
render();
</script>
</body>
</html>
